<!DOCTYPE html>
<html>
    <title>Admin Panel</title>
    <head>
        <link rel="stylesheet" href="/static/stylesheet.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.svg') }}">
    </head>
    <body>
        <div class="navigation-bar d-flex justify-content-around container-fluid dark-background-colour" id="navigation-bar">
            <div onclick="goToPage('/')" class="link-container home-link-container">
                <a href="/"><i class="fa fa-home"></i>  Home</a>
            </div>
        </div>
        <div class="container-fluid dark-background-colour admin-content">
            <table class="tbt-table">
                <thead class="tbt-row">
                    <th>Album ID</th>
                    <th id="stat">{{ stat }}</th>
                </thead>
                <tbody>
                    {% for album in albums %}
                    <tr class="tbt-row admin-stat-album">
                        <td class="tbt-name">{{ album["id"] }}</td>
                        <td class="tbt-comments" {% if current_user.is_authenticated %} contenteditable="true" {% endif %} style="text-align: center;">{{ album[stat] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    <script src="{{ url_for('static', filename='adminScript.js') }}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</body>
</html>
